<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project cover composition</title><link rel="stylesheet" href="fonts.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#090e14;color:#e7eee9;font-family:'DM Sans',sans-serif}.composition{position:relative;width:1600px;height:900px;background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--accent) 15%,#090e14),#080d12 75%);overflow:hidden}.halo{position:absolute;left:12%;right:12%;top:10%;bottom:8%;border-radius:50%;box-shadow:0 0 170px color-mix(in srgb,var(--accent) 15%,transparent)}.frame{position:absolute;left:170px;top:90px;width:1260px;height:720px;overflow:hidden;border-radius:16px;background:#0d1018;box-shadow:0 34px 80px #0009,0 0 0 1px #ffffff32,inset 0 0 0 1px #fff1}.frame img{position:absolute;max-width:none;display:block}.edge{position:absolute;inset:0;border:1px solid #ffffff19;border-radius:16px;pointer-events:none;box-shadow:inset 0 0 35px #0002}.corner{position:absolute;width:45px;height:45px;border-color:var(--accent);opacity:.5}.tl{left:135px;top:55px;border-top:1px solid;border-left:1px solid}.br{right:135px;bottom:55px;border-bottom:1px solid;border-right:1px solid}.signature{position:absolute;left:171px;bottom:38px;right:171px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:#aab7bc}.signature b{font-weight:500;color:var(--accent)}
</style><main class="composition"><div class="halo"></div><div class="corner tl"></div><div class="corner br"></div><div class="frame"><img alt="실제 프로젝트 화면"><div class="edge"></div></div><div class="signature"><b></b><span>KIMDOL / SELECTED WORK</span></div></main><script>
// Browser-rendered compositions of real captures. No generated application UI.
const covers={
 tft:{src:'tft-candidates.jpg',accent:'#b4a3ff',label:'TFT TEAM OPTIMIZER',crop:[228,330,1112,630],width:1585},
 syntax:{src:'syntaxbridge-live.png',accent:'#91dfc9',label:'SYNTAXBRIDGE STUDIO',crop:[94,42,1094,625],width:1265},
 unity:{src:'arpg-gameplay.jpg',accent:'#c7b2ef',label:'UNITY / ACTION RPG',crop:[160,120,1600,765],width:1920,fit:'contain'},
 unreal:{src:'unreal-gameplay.jpg',accent:'#e8afcf',label:'UNREAL / COMBAT CENTRIC',crop:[0,24,1920,1020],width:1920},
 cpp:{src:'bugghouse.png',accent:'#f4cf8f',label:'C++ / NATIVE GRAPHICS',crop:[8,32,1010,690],width:1026}
};
const key=new URLSearchParams(location.search).get('project')||'tft',p=covers[key]||covers.tft;
const stage=document.querySelector('.composition'),frame=document.querySelector('.frame'),img=document.querySelector('img');stage.style.setProperty('--accent',p.accent);stage.style.transformOrigin='top left';stage.style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/900)})`;document.querySelector('.signature b').textContent=p.label;
const [x,y,w,h]=p.crop,scale=p.fit==='contain'?Math.min(1260/w,720/h):Math.max(1260/w,720/h);
const crop=document.createElement('div');crop.style.cssText=`position:absolute;overflow:hidden;width:${w*scale}px;height:${h*scale}px;left:${(1260-w*scale)/2}px;top:${(720-h*scale)/2}px`;frame.insertBefore(crop,img);crop.append(img);img.style.width=p.width*scale+'px';img.style.left=-x*scale+'px';img.style.top=-y*scale+'px';img.src='assets/projects/'+p.src;document.body.dataset.project=key;
</script></html>
